# =============================================================================
#  coturn — relais TURN/STUN (sauve les connexions derrière NAT stricts)
#  ⚔ Sur la box : rediriger 3478 TCP+UDP et 49160-49200 UDP vers le mini-PC.
#  network_mode: host → pas de mapping Docker nécessaire.
# =============================================================================

listening-port=3478
# tls-listening-port=5349      # à activer plus tard avec des certificats (guide ch. 11)

fingerprint
lt-cred-mech

realm=turn.local
# Utilisateur statique de démarrage — à remplacer par l'API REST dynamique (P3)
user=dts:CHANGE_ME_TURN_PASSWORD

# IP publique du mini-PC (reportée aussi dans .env : PUBLIC_IP)
external-ip=CHANGEME_PUBLIC_IP

# Plage des ports relais (à rediriger sur la box)
min-port=49160
max-port=49200

no-cli
no-multicast-peers
no-tlsv1
no-tlsv1_1
