# =============================================================================
#  COMPOSE DE DÉVELOPPEMENT — « Discord type shit »
#  Usage : docker compose up -d        (Base + cache + fichiers + mails)
#  L'API et les apps Flutter tournent sur votre machine (hot reload) :
#  elles joignent ces services via localhost:<port>.
#  Données persistées dans des volumes Docker ; reset complet : docker compose down -v
# =============================================================================

name: dts-dev

services:

  # ── Base de données : PostgreSQL 16 ─────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: dts-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dts}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dts_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-dts}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-dts} -d $${POSTGRES_DB:-dts}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  # ── Cache / présence : Redis 7 ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: dts-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  # ── Stockage objet S3 : Garage ───────────────────────────────────────────
  # MinIO a retiré toutes ses images Docker et binaires publics (2026).
  # Garage : S3 open source (AGPL), ultra-léger, conçu pour l'auto-hébergement.
  # --single-node provisionne automatiquement layout + clé API + bucket par
  # défaut à partir des variables GARAGE_DEFAULT_* → zéro étape manuelle.
  # Config : docker/garage.toml (copie de docker/garage.toml.example).
  garage:
    image: dxflrs/garage:v2.4.1
    container_name: dts-garage
    entrypoint: ["/garage"]
    command: ["server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY:-dtsdevkey}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_KEY:-dts_dev_secret_change_me}
      GARAGE_DEFAULT_BUCKET: ${S3_BUCKET:-dts-files}
    ports:
      - "${GARAGE_S3_PORT:-3900}:3900"   # API S3 (uploads présignés, aws-sdk)
      - "${GARAGE_WEB_PORT:-3902}:3902"  # fichiers servis en HTTP (optionnel)
    volumes:
      - ./docker/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "-c", "/etc/garage.toml", "status"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  # ── Mails transactionnels (interceptés en dev) : MailPit ────────────────
  # L'API envoie sur smtp://localhost:1025 ; boîte web sur http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: dts-mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # interface web
    restart: unless-stopped

  # ── Optionnel : explorateur BDD ─────────────────────────────────────────
  # Activer avec : docker compose --profile tools up -d
  adminer:
    image: adminer:4
    container_name: dts-adminer
    profiles: ["tools"]
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: dts-postgres
      ADMINER_DESIGN: "dracula"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  garage_meta:
  garage_data:
