# =============================================================================
#  COMPOSE DE PRODUCTION — « Discord type shit » (mini-PC à la maison)
#  Usage : docker compose -f docker-compose.prod.yml up -d --build
#  Prérequis : .env renseigné (copie de .env.prod.example), builds Flutter faits,
#  Caddyfile/livekit.yaml/turnserver.conf adaptés (voir docs/ops.md).
#
#  Topologie (guide ch. 13) : un seul point d'entrée public (Caddy, 80/443),
#  la voix en UDP direct (LiveKit 50000-60000, coturn 3478 + 49160-49200),
#  tout le reste sur le réseau Docker privé « backend ».
#  Back-office : servi en LOCAL uniquement (ADR-0003) — 127.0.0.1:8080 sur
#  l'hôte, accessible depuis le serveur ou via tunnel SSH (voir docs/ops.md).
# =============================================================================

name: dts-prod

services:

  # ── Passerelle HTTPS : Caddy ────────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: dts-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"        # HTTP/3 (optionnel mais gratuit)
      # Back-office : LOCAL UNIQUEMENT (ADR-0003). Publié sur le loopback de
      # l'hôte → invisible d'Internet. Accès distant = tunnel SSH :
      #   ssh -L 8080:localhost:8080 utilisateur@serveur  →  http://localhost:8080
      - "127.0.0.1:8080:8080"
    environment:
      DOMAIN: ${DOMAIN:?renseignez DOMAIN dans .env}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data            # certificats Let's Encrypt (persistant !)
      - caddy_config:/config
      - ./apps/admin/build/web:/srv/bo:ro   # back-office Flutter Web (build statique)
      - ./site/app:/srv/app:ro              # page d'accueil/landing statique (optionnel)
    depends_on:
      - api
    networks: [edge, backend]
    restart: unless-stopped

  # ── API NestJS ──────────────────────────────────────────────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: dts-api
    environment:
      NODE_ENV: production
      # Références INTERNE au réseau Docker (jamais localhost) :
      DATABASE_URL: postgresql://${POSTGRES_USER:-dts}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-dts}?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://garage:3900
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-https://files.local}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?}
      S3_BUCKET: ${S3_BUCKET:-dts-files}
      S3_FORCE_PATH_STYLE: "true"
      JWT_SECRET: ${JWT_SECRET:?}
      LIVEKIT_URL: wss://vocal.${DOMAIN}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # Origines autorisées (CORS) : l'application web + le BO servi en local
      # (ADR-0003 : le BO appelle l'API publique depuis http://localhost:8080)
      CORS_ORIGINS: ${CORS_ORIGINS:-https://app.${DOMAIN},http://localhost:8080}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      garage:
        condition: service_healthy
    networks: [backend]
    init: true
    restart: unless-stopped

  # ── Données ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: dts-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dts}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:-dts}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-dts} -d $${POSTGRES_DB:-dts}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [backend]        # AUCUN port publié : injoignable d'Internet
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: dts-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [backend]
    restart: unless-stopped

  # ── Stockage objet S3 : Garage (remplace MinIO, retiré des registres publics 2026)
  garage:
    image: dxflrs/garage:v2.4.1
    container_name: dts-garage
    entrypoint: ["/garage"]
    command: ["server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY:?}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_KEY:?}
      GARAGE_DEFAULT_BUCKET: ${S3_BUCKET:-dts-files}
    volumes:
      - ./docker/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "-c", "/etc/garage.toml", "status"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [backend, edge]   # edge : servi au public via files.DOMAIN (URLs présignées)
    restart: unless-stopped

  # ── Voix / vidéo / partage d'écran : LiveKit (SFU) ──────────────────────
  livekit:
    image: livekit/livekit-server:latest
    container_name: dts-livekit
    command: ["--config", "/etc/livekit.yaml"]
    volumes:
      - ./docker/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "50000-60000/udp"      # plage UDP médias (à ouvrir aussi sur la box)
    networks: [edge]           # signalisation wss://vocal.DOMAIN via Caddy
    restart: unless-stopped

  # ── Relais TURN (réseaux stricts) : coturn ──────────────────────────────
  coturn:
    image: coturn/coturn:latest
    container_name: dts-coturn
    network_mode: host          # meilleur comportement NAT (pas de mapping de ports)
    volumes:
      - ./docker/turnserver.conf:/etc/coturn/turnserver.conf:ro
    restart: unless-stopped

  # ── Optionnel : mises à jour automatiques des images ────────────────────
  # docker compose -f docker-compose.prod.yml --profile maintenance up -d
  watchtower:
    image: containrrr/watchtower:latest
    container_name: dts-watchtower
    profiles: ["maintenance"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["--interval", "86400", "--cleanup"]
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  garage_meta:
  garage_data:
  caddy_data:
  caddy_config:

networks:
  edge:      # exposé via Caddy : api, files, vocal (le BO reste local :8080 — ADR-0003)
  backend:   # privé : données + API
